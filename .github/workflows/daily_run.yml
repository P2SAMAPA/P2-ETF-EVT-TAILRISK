name: Daily EVT + Flow Positioning Run

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC Mon-Fri (after US market close)
  workflow_dispatch:           # Manual trigger with optional backfill
    inputs:
      backfill:
        description: 'Run full historical backfill for Flow module (first run only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  # ── Job 1: EVT Tail Risk (existing, unchanged) ────────────────────────────
  run-evt:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EVT Trainer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py

  # ── Job 2: Flow & Positioning (new) ─────────────────────────────────────
  run-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 180       # COT download + yfinance for 20 ETFs takes ~10 min
    needs: run-evt              # Run after EVT so logs are sequential

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flow Trainer — Daily Update
        if: ${{ github.event.inputs.backfill != 'true' }}
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          NASDAQ_API_KEY:  ${{ secrets.NASDAQ_API_KEY }}
        run: python flow_trainer.py

      - name: Run Flow Trainer — Full Backfill (manual trigger only)
        if: ${{ github.event.inputs.backfill == 'true' }}
        env:
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
          NASDAQ_API_KEY:  ${{ secrets.NASDAQ_API_KEY }}
        run: python flow_trainer.py --backfill
        # Note: backfill downloads CFTC data for every year 2008–present
        # and yfinance history for all 20 ETFs — allow up to 3 hours.
        timeout-minutes: 180
