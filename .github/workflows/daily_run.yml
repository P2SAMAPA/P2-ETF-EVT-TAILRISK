name: Daily EVT + Flow Training

on:
  schedule:
    - cron: '0 22 * * 1-5'   # 22:00 UTC Mon–Fri (after US market close)
  workflow_dispatch:           # Manual trigger for testing

jobs:
  # ── Job 1: EVT Tail Risk ─────────────────────────────────────────────────
  run-evt:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EVT trainer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python trainer.py

  # ── Job 2: Flow & Positioning ────────────────────────────────────────────
  run-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 60        # Daily update is fast: ~5–10 min
    needs: run-evt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flow trainer (daily incremental update)
        env:
          HF_TOKEN:       ${{ secrets.HF_TOKEN }}
          NASDAQ_API_KEY: ${{ secrets.NASDAQ_API_KEY }}
        run: python flow_trainer.py
